name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: Linux acceptance (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (v4)

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (v4)

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust 1.97 and wasm target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-18
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt

      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (v4)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-1.97-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97-

      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run complete acceptance sequence
        run: |
          source "$HOME/.cargo/env"
          node scripts/print-runner-diagnostics.mjs
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
          cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path core/Cargo.toml --workspace
          cargo check --manifest-path core/Cargo.toml -p kiriko-wasm --target wasm32-unknown-unknown
          pnpm install --frozen-lockfile
          # Build the native addon and WASM once, before any test or preview
          # webServer starts, so the in-use addon is never rebuilt mid-suite.
          pnpm core:build
          pnpm typecheck
          pnpm --filter kiriko-server typecheck
          # Run Vitest directly so the standalone pretest core build does not
          # duplicate the explicit, already-complete core build above.
          pnpm exec vitest run
          # The server suite includes the mandatory real-gdal3.js GDB smoke
          # (server/test/gdbSmoke.test.ts) — no environment gate.
          pnpm test:server
          # Prove the Playwright webServer can replace absent output with a
          # current production web build; build:web never rebuilds Rust.
          rm -rf dist
          test ! -e dist
          pnpm exec playwright test --project=chromium
          # Single worker: real-time thresholds need an uncontended CPU.
          pnpm exec playwright test --project=chromium-performance --workers=1
          pnpm exec playwright test --project=firefox
          pnpm exec playwright test --project=webkit
          pnpm exec playwright test --project=chromium-visual
          npx -y node@24 -e "const core=require('./core/crates/kiriko-node'); if(typeof core.compileImdf!=='function'||typeof core.inspectBundle!=='function') process.exit(1)"

      - name: Preserve Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: acceptance-playwright-diagnostics
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  # Build native/WASM runtime files once, then fan the exact same SHA/runtime
  # out to five isolated hosted runners. These diagnostic checks supplement;
  # they never replace or relax Linux acceptance above.
  performance_assets:
    name: Performance diagnostic assets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (v4)

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (v4)

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust 1.97 and wasm target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-18
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (v4)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-1.97-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97-

      - name: Install wasm-pack 0.13.1
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build shared performance runtime
        run: |
          pnpm install --frozen-lockfile
          source "$HOME/.cargo/env"
          pnpm core:build
          tar -czf performance-core.tgz \
            core/crates/kiriko-node/index.js \
            core/crates/kiriko-node/index.d.ts \
            core/crates/kiriko-node/*.node \
            core/crates/kiriko-wasm/pkg

      - name: Upload shared performance runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: performance-core-${{ github.sha }}
          path: performance-core.tgz
          if-no-files-found: error
          retention-days: 3

  performance_replicate:
    name: Performance diagnostic (${{ matrix.replica }}/5)
    if: github.event_name == 'pull_request'
    needs: performance_assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5]
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (v4)

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (v4)

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared performance runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (v4)
        with:
          name: performance-core-${{ github.sha }}

      - name: Restore shared performance runtime
        run: tar -xzf performance-core.tgz

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unchanged isolated level-change acceptance
        run: |
          node scripts/print-runner-diagnostics.mjs
          pnpm exec playwright test e2e/viewer.performance.spec.ts \
            --project=chromium-performance --workers=1 \
            --grep "level-change P95"

      - name: Preserve performance failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: performance-diagnostics-${{ matrix.replica }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  # Run the one-condition dwell counterfactual only when at least one no-dwell
  # replica fails. It is diagnostic and does not replace the required method.
  performance_dwell_diagnostic:
    name: Performance diagnostic (250ms dwell counterfactual)
    if: ${{ always() && needs.performance_assets.result == 'success' && needs.performance_replicate.result == 'failure' }}
    needs: [performance_assets, performance_replicate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (v4)

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (v4)

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared performance runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (v4)
        with:
          name: performance-core-${{ github.sha }}

      - name: Restore shared performance runtime
        run: tar -xzf performance-core.tgz

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run 250ms unmeasured-dwell counterfactual
        env:
          KIRIKO_PERF_DWELL_DIAGNOSTIC: "1"
        run: |
          node scripts/print-runner-diagnostics.mjs
          pnpm exec playwright test e2e/viewer.performance.spec.ts \
            --project=chromium-performance --workers=1 \
            --grep "diagnostic: level-change"

      - name: Preserve dwell diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: performance-diagnostics-250ms-dwell
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  native-addon:
    name: Native addon (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (v4)

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (v4)

      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-18
        with:
          toolchain: 1.97.0

      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (v4)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-1.97-node-${{ matrix.node }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97-node-${{ matrix.node }}-
            ${{ runner.os }}-cargo-1.97-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and require native addon
        run: |
          pnpm core:build:node
          node -e "const core=require('./core/crates/kiriko-node'); if(typeof core.compileImdf!=='function'||typeof core.inspectBundle!=='function') process.exit(1)"
